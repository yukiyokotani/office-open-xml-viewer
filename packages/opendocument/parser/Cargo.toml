[package]
name = "opendocument-parser"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenDocument readers projecting into the OOXML renderer models"
repository = "https://github.com/yukiyokotani/office-open-xml-viewer"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
odt = [
    "dep:js-sys",
    "dep:docx-model",
]
# The ODF chart reader, shared by the spreadsheet and presentation readers.
odf-chart = ["dep:serde_json"]
ods = [
    "odf-chart",
    "dep:js-sys",
    "dep:xlsx-model",
    "dep:serde",
]

[dependencies]
console_error_panic_hook = { workspace = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { workspace = true }
roxmltree = { workspace = true }
ooxml-common = { workspace = true }
crc32fast = { workspace = true, optional = true }
docx-model = { workspace = true, optional = true, features = ["owned-source-cursor"] }
xlsx-model = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
png = { version = "0.18", default-features = false, optional = true }
gif = { version = "0.14", default-features = false, features = ["std"], optional = true }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"], optional = true }
zune-core = { version = "0.5", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
omit-default-module-path = true

[[example]]
name = "inspect_odt"
required-features = ["odt"]

[[example]]
name = "inspect_ods"
required-features = ["ods"]
