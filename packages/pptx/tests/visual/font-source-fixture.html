<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>* { margin: 0; padding: 0; } canvas { display: block; }</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module">
    // Font-source worker equivalence (font-source-worker-equivalence.spec.ts):
    // one load per page so each mode's font requests are counted on their own.
    import { PptxPresentation, fontCss } from '/src/index.ts';

    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') ?? 'main';
    try {
      const resp = await fetch('/generated/font-source.pptx');
      if (!resp.ok) throw new Error(`fetch font-source.pptx -> ${resp.status}`);
      const buf = await resp.arrayBuffer();
      // ?substitute=1: the deck names a face no source serves by name; the
      // source declares the fixture family as its substitute.
      // ?substitute=bullet: an Arabic-scoped substitute for the bullet face.
      const substitutes = params.get('substitute') === '1'
        ? [{ for: 'Absent Office Face', use: 'Ooxml Fixture' }]
        : params.get('substitute') === 'bullet'
          ? [{ for: 'Absent Bullet Face', use: 'Ooxml Fixture', script: 'arabic' }] : undefined;
      const fonts = mode === 'none' ? undefined
        : [fontCss({ url: new URL('/generated/fixture-fonts.css', location.href).href, ...(substitutes ? { substitutes } : {}) })];
      const pres = await PptxPresentation.load(buf, {
        ...(mode === 'worker' ? { mode: 'worker' } : {}),
        ...(params.get('progressive') === '1' ? { progressiveLayout: true } : {}),
        ...(fonts ? { fonts } : {}),
      });
      const bmp = await pres.renderSlideToBitmap(0, { width: 960, dpr: 1 });
      const canvas = document.getElementById('canvas');
      canvas.width = bmp.width;
      canvas.height = bmp.height;
      canvas.getContext('2d').drawImage(bmp, 0, 0);
      bmp.close();
      pres.destroy();
      document.body.dataset.status = 'ready';
    } catch (err) {
      document.body.dataset.status = 'error';
      document.body.dataset.errorMessage = err.message;
      console.error('[font-source-fixture] error:', err);
    }
  </script>
</body>
</html>
