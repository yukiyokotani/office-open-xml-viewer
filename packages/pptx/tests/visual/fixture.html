<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="scroll-host"></div>

  <script type="module">
    import { PptxViewer, PptxScrollViewer } from '/src/index.ts';
    import { threeD } from '@ooxml-test-three-d-renderer';
    import { regionMap } from '@ooxml-test-region-map-renderer';
    import { tiff } from '@ooxml-test-tiff-renderer';
    import { chartEx } from '@ooxml-test-chart-ex-renderer';

    const fixtureFontStylesheets = [
      '/node_modules/@fontsource/nunito-sans/400.css',
      '/node_modules/@fontsource/nunito-sans/400-italic.css',
      '/node_modules/@fontsource/nunito-sans/700.css',
      '/node_modules/@fontsource/nunito-sans/700-italic.css',
      '/node_modules/@fontsource/nunito-sans/300.css',
      '/node_modules/@fontsource/nunito-sans/600.css',
    ];
    const params   = new URLSearchParams(location.search);
    const slideIdx = Math.max(0, parseInt(params.get('slide') ?? '0', 10));
    const pptxName = params.get('pptx') ?? 'sample';
    // Optional render width override (CSS px), e.g. ?width=960 — used by the
    // scale-parameterised specs; the default matches the reference images.
    const width    = Math.max(1, parseInt(params.get('width') ?? '1280', 10));

    // ?fonts=corpus loads the faces the public specimen corpus names (Noto Sans,
    // Noto Sans JP, Arabic, Hebrew) from this package's own @fontsource dependencies, so the
    // corpus VRT runs offline. Fontsource partitions each weight/style into
    // unicode-range faces and a font shorthand only fetches the subset matching
    // its sample text, so every declared face is loaded before rendering.
    const CORPUS_FONTS = {
      'noto-sans': ['400', '400-italic', '700', '700-italic'],
      'noto-sans-jp': ['400', '700'],
      'noto-sans-arabic': ['400', '700'],
      'noto-sans-hebrew': ['400', '700'],
    };
    const corpusFontStylesheets = Object.entries(CORPUS_FONTS)
      .flatMap(([name, files]) => files.map((f) => `/node_modules/@fontsource/${name}/${f}.css`));
    const fontFamilyKey = (family) => family.trim().replace(/^['"]|['"]$/g, '').toLowerCase();
    async function loadFixtureFonts(hrefs, families) {
      const sheets = await Promise.all(hrefs.map((href) => new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.onload = () => link.sheet
          ? resolve(link.sheet)
          : reject(new Error(`fixture font stylesheet unavailable: ${href}`));
        link.onerror = () => reject(new Error(`fixture font stylesheet failed: ${href}`));
        document.head.append(link);
      })));
      for (const family of families) {
        const declared = sheets.reduce((count, sheet) => count + [...sheet.cssRules].filter(
          (rule) => rule instanceof CSSFontFaceRule && fontFamilyKey(rule.style.fontFamily) === family,
        ).length, 0);
        const faces = [...document.fonts].filter((face) => fontFamilyKey(face.family) === family);
        if (declared === 0 || faces.length !== declared) {
          throw new Error(`fixture ${family} faces: declared ${declared}, registered ${faces.length}`);
        }
        await Promise.all(faces.map((face) => face.load()));
      }
      await document.fonts.ready;
    }

    // ?viewer=scroll renders every slide through PptxScrollViewer (default
    // options otherwise) so the scroll path has its own pixel self-VRT.
    const scrollViewer = params.get('viewer') === 'scroll';
    const canvas = document.getElementById('canvas');
    const scrollHost = document.getElementById('scroll-host');
    const viewerOptions = {
      width,
      threeD,
      regionMap,
      tiff,
      chartEx,
      onError: (err) => {
        document.body.dataset.status = 'error';
        document.body.dataset.errorMessage = err.message;
        console.error('[fixture] error:', err);
      },
    };
    let viewer;
    if (scrollViewer) {
      canvas.remove();
      scrollHost.style.cssText = `width:${width}px;height:800px;`;
      // Every slide is mounted, so load() resolves after each one is painted.
      viewer = new PptxScrollViewer(scrollHost, {
        ...viewerOptions,
        gap: 0,
        paddingLeft: 0,
        paddingRight: 0,
        overscan: 100000,
        enableZoom: false,
        refitOnResize: false,
      });
    } else {
      scrollHost.remove();
      viewer = new PptxViewer(canvas, viewerOptions);
    }
    let destroyed = false;
    const destroy = () => {
      if (destroyed) return;
      destroyed = true;
      viewer.destroy();
    };
    window.destroyPptxVrt = destroy;
    window.addEventListener('pagehide', destroy, { once: true });

    try {
      await loadFixtureFonts(fixtureFontStylesheets, ['nunito sans']);
      if (params.get('fonts') === 'corpus') await loadFixtureFonts(corpusFontStylesheets, ['noto sans', 'noto sans jp', 'noto sans arabic', 'noto sans hebrew']);
      const resp = await fetch(`/${pptxName}.pptx`);
      if (!resp.ok) throw new Error(`fetch failed: ${resp.status}`);
      const buf = await resp.arrayBuffer();
      await viewer.load(buf);
      document.body.dataset.slideCount = String(viewer.slideCount);
      if (scrollViewer) {
        // Slot canvases stay mounted; the spec reads each one by slide index.
        window.pptxVrtSlideDataUrl = (slideIndex) => scrollHost
          .querySelector(`[data-slide-index="${slideIndex}"] canvas`)?.toDataURL('image/png') ?? null;
      } else {
        if (slideIdx !== 0) {
          await viewer.goToSlide(slideIdx);
        }
        window.renderPptxVrtSlide = async (slideIndex) => {
          await viewer.goToSlide(slideIndex);
        };
      }
      document.body.dataset.status = 'ready';
    } catch (err) {
      document.body.dataset.status = 'error';
      document.body.dataset.errorMessage = String(err);
      console.error('[fixture] fatal:', err);
    }
  </script>
</body>
</html>
