<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DOCX Viewer – VRT fixture</title>
  <style>
    body { margin: 0; background: #888; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script type="module">
  import { DocxDocument } from '/src/index.ts';
  import { threeD } from '@ooxml-test-three-d-renderer';
  import { regionMap } from '@ooxml-test-region-map-renderer';
  import { stableCanvasRender } from './stable-canvas-render.mjs';

  const params = new URLSearchParams(location.search);
  const file = params.get('file') ?? 'sample-1.docx';
  const page = parseInt(params.get('page') ?? '0', 10);
  const width = parseInt(params.get('width') ?? '612', 10);

  const canvas = document.getElementById('canvas');

  try {
    const doc = await DocxDocument.load('/' + file, { threeD, regionMap });
    // Report the renderer's REAL page count so the VRT spec can assert the
    // requested page index is in range. renderPage() silently clamps an
    // out-of-range index back to page 0 (renderer.ts: `pages[pageIndex] ??
    // pages[0]`), so without this the harness cannot tell a genuine page from a
    // duplicated first page (see the #993 Thai-sample regression).
    document.body.dataset.pageCount = String(doc.pageCount);
    const renderStablePage = async (pageIndex) => {
      await stableCanvasRender({
        render: () => doc.renderPage(canvas, pageIndex, { width, dpr: 1 }),
        fonts: document.fonts,
        nextFrame: () => new Promise((resolve) => requestAnimationFrame(resolve)),
      });
    };
    await renderStablePage(page);
    window.renderDocxVrtPage = renderStablePage;
    document.body.dataset.status = 'ready';
  } catch (e) {
    document.body.dataset.status = 'error';
    document.body.dataset.errorMessage = e.message;
    console.error(e);
  }
</script>
</body>
</html>
