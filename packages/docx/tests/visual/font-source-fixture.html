<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>* { margin: 0; padding: 0; } canvas { display: block; }</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module">
    // Font-source worker equivalence (font-source-worker-equivalence.spec.ts):
    // one load per page so each mode's font requests are counted on their own.
    import { DocxDocument, fontCss } from '/src/index.ts';

    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') ?? 'main';
    try {
      const resp = await fetch('/generated/font-source.docx');
      if (!resp.ok) throw new Error(`fetch font-source.docx -> ${resp.status}`);
      const buf = await resp.arrayBuffer();
      const fonts = mode === 'none' ? undefined : [fontCss({ url: '/generated/fixture-fonts.css' })];
      const doc = await DocxDocument.load(buf, { ...(mode === 'worker' ? { mode: 'worker' } : {}), ...(fonts ? { fonts } : {}) });
      const bmp = await doc.renderPageToBitmap(0, { width: 816, dpr: 1 });
      const canvas = document.getElementById('canvas');
      canvas.width = bmp.width;
      canvas.height = bmp.height;
      canvas.getContext('2d').drawImage(bmp, 0, 0);
      bmp.close();
      doc.destroy();
      document.body.dataset.status = 'ready';
    } catch (err) {
      document.body.dataset.status = 'error';
      document.body.dataset.errorMessage = err.message;
      console.error('[font-source-fixture] error:', err);
    }
  </script>
</body>
</html>
