[package]
name = "legacy-office-converter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimum-sufficient, macro-free legacy Office to OOXML converter"
repository = "https://github.com/yukiyokotani/office-open-xml-viewer"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
fuzzing = []
direct-ppt = ["dep:js-sys", "dep:serde_json"]
inspection = ["direct-ppt"]

[[example]]
name = "inspect_xls_images"
required-features = ["inspection"]

[[example]]
name = "inspect_xls_anchors"
required-features = ["inspection"]

[[example]]
name = "inspect_ppt_direct"
required-features = ["inspection"]

[dependencies]
console_error_panic_hook = { workspace = true }
flate2 = { workspace = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
pptx-model = { workspace = true }
ooxml-common = { workspace = true }
xlsx-model = { workspace = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
xlsx-parser = { path = "../../xlsx/parser" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
omit-default-module-path = true
