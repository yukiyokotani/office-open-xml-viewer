name: Publish VS Code Extension

# v0.89 is a maintenance line behind 0.90 and the Marketplace already has
# 0.90.x, so the extension is not published from this branch: no tag trigger
# and no publish step. A manual run only packages and uploads the VSIX.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ── Rust toolchain (for building WASM parsers) ─────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/pptx/parser
            packages/xlsx/parser
            packages/docx/parser
            packages/legacy-office/parser

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # ── Node / pnpm ────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build (WASM → library packages → extension bundle) ─────────────────
      - name: Build WASM (all parsers)
        run: pnpm build:wasm

      - name: Build library packages (pptx/xlsx/docx/core)
        # The extension imports @silurus/ooxml-{pptx,xlsx,docx} from workspace:*;
        # each needs its dist/ before esbuild bundles the extension. Keep the
        # root package out of this recursive build: its declaration bundler and
        # package tsc builds write overlapping generated state.
        run: >-
          pnpm
          --filter @silurus/ooxml-core
          --filter @silurus/ooxml-pptx
          --filter @silurus/ooxml-xlsx
          --filter @silurus/ooxml-docx
          -r --workspace-concurrency=1 build

      # ── Package (.vsix) ────────────────────────────────────────────────────
      # --no-dependencies: extension is fully bundled by esbuild, no node_modules needed.
      # `vsce package` always runs the extension's `vscode:prepublish` script
      # (`node esbuild.config.mjs --production`) first, so this step builds the
      # production bundle itself; a separate esbuild step would only repeat it.
      - name: Package VSIX
        working-directory: packages/vscode-extension
        run: pnpm exec vsce package --no-dependencies --out ooxml-viewer.vsix

      # The webview needs every format's parser. Code-split chunks carry the
      # DOCX and PPTX parser URLs, so check the packaged files, not the source.
      - name: Verify the VSIX ships every parser WASM
        working-directory: packages/vscode-extension
        run: |
          for format in docx xlsx pptx; do
            unzip -l ooxml-viewer.vsix | grep -qE "extension/dist/assets/${format}_parser_bg-[^ ]+\.wasm$" \
              || { echo "::error::VSIX lacks the ${format} parser WASM"; exit 1; }
          done
          if grep -qE '"(docx|xlsx|pptx)_parser_bg\.wasm"' dist/webview.js; then
            echo "::error::webview.js references a parser WASM outside dist/assets"; exit 1
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ooxml-viewer-vsix
          path: packages/vscode-extension/ooxml-viewer.vsix
          if-no-files-found: error
