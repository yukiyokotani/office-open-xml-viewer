name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to retry (for example, v0.83.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # required for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Manual runs publish an existing immutable release tag, never the
          # branch selected in the workflow-dispatch UI.
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      # ── Rust toolchain ──────────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/pptx/parser
            packages/xlsx/parser
            packages/docx/parser
            packages/legacy-office/parser
            packages/opendocument/parser

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # ── Node / pnpm ─────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        # version is read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Verify release ref
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          RELEASE_TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git describe --tags --exact-match HEAD)" == "$RELEASE_TAG" ]]
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          [[ "$RELEASE_TAG" == "v$PACKAGE_VERSION" ]]
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify companion version lockstep
        run: pnpm check:versions

      # ── Build ────────────────────────────────────────────────────────────────
      # Builds the viewer parsers, the legacy readers and one OpenDocument reader
      # per `@silurus/ooxml-opendocument` export (`wasm:<format>` cargo feature
      # scripts, see scripts/build-opendocument-wasm.mjs).
      - name: Build WASM (all packages)
        run: pnpm build:wasm

      # Gate the release on a clean typecheck so a tag never publishes
      # type-broken code (defence in depth alongside the PR CI workflow).
      - name: Typecheck
        run: pnpm typecheck

      # A tag must never publish code whose unit tests are red. WASM was built
      # above, so the renderer/parser probe suites have their .wasm available.
      - name: Unit tests
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # A manual retry follows a prior fully reviewed tag run. Give
            # shared runners extra scheduling headroom without weakening the
            # normal tag-push gate.
            ./node_modules/.bin/vitest run --testTimeout=15000
            node --test tests/visual/private-corpus.test.mjs scripts/companion-release.test.mjs
          else
            pnpm test
          fi

      - name: Build library
        run: pnpm build

      # PD13 — fail the release if a WASM parser was re-inlined into a JS bundle
      # as a base64 data-URL (which once bloated the package ~6 MB). The parsers
      # must ship as real .wasm assets referenced by URL; this gate scans the
      # freshly built dist/ for the base64 WASM magic before we pack.
      - name: Guard against base64-inlined WASM
        run: pnpm check:no-inline-wasm

      - name: Verify production render-worker assets
        run: pnpm check:production-render-workers

      - name: Verify optional ChartEx bundle boundary
        run: pnpm check:optional-chart-ex

      - name: Verify optional TIFF bundle boundary
        run: pnpm check:optional-tiff

      - name: Verify per-format legacy Office model source boundaries
        run: |
          pnpm check:core-legacy-boundary
          pnpm check:optional-legacy-doc
          pnpm check:optional-legacy-ppt
          pnpm check:optional-legacy-xls
          pnpm check:legacy-wasm-exports

      # ── Verify the package that is about to be published ──────────────────────
      # publint checks packaging correctness (exports ordering, file presence,
      # module/type field sanity). attw checks that every entrypoint resolves to
      # type declarations under each module-resolution mode. Both run against the
      # real `npm pack` tarball, so a broken `exports` map fails the release
      # instead of shipping. `--profile esm-only` acknowledges this package is
      # intentionally ESM-only: it ignores the node10 and node16-from-CJS
      # resolutions (which cannot succeed without a legacy CJS build we do not
      # ship) while still failing on any regression in the ESM / bundler columns.
      - name: Verify all package exports (publint + attw)
        run: |
          for directory in . packages/legacy-office packages/opendocument; do
            (cd "$directory" && npx --yes publint && npx --yes @arethetypeswrong/cli --pack . --profile esm-only)
          done

      - name: Install Playwright Chrome (only if missing)
        timeout-minutes: 5
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            pnpm exec playwright install chrome --with-deps
          fi

      - name: Smoke test all packed packages in Node and Vite
        run: pnpm test:packed-packages

      # Exact-version retries: registry failures other than E404 fail closed.
      # The root must be available before its exact-peer companions publish
      # (@silurus/ooxml-legacy-office, then @silurus/ooxml-opendocument).
      # NPM_TOKEN must be allowed to create new @silurus packages for a
      # companion's first release; see AGENTS.md "Release Workflow".
      - name: Publish viewer, then companions
        run: node scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
