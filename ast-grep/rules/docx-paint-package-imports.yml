id: docx-paint-package-imports
language: TypeScript
severity: error
message: DOCX paint may import only the reviewed bindings of the shared core package.
note: |
  A package import in `packages/docx/src/paint` must be a plain named import
  (no default, namespace, alias, side-effect or re-export form) of bindings
  listed below, from a package listed below. Value bindings and type bindings
  are separate lists: a statement imports either values (`import { a, b }`)
  or types (`import type { A }` / `import { type A }`), never a mix.
  Add a binding here only when it cannot measure text, acquire layout or
  reach the renderer; say why in a comment.
utils:
  core-value:
    any:
      - regex: "^acquireBitmapCacheLease$"
      - regex: "^applyDuotone$"
      # Pixel corrections, effect budgets and cache keys consume decoded resources without acquiring layout.
      - regex: "^blipPixelEffectsKey$"
      - regex: "^autoContrastColor$"
      # A retained run-shading preset is rasterized as an 8x8 paint tile;
      # this helper cannot measure text or change the layout result.
      - regex: "^buildPatternBitmap$"
      - regex: "^captureDecodedBitmapCacheEpoch$"
      - regex: "^canvasFontString$"
      - regex: "^clampCanvasSize$"
      # Chart picture-marker discovery and lookup warm the document-owned image
      # cache before measurement-free chart paint. They expose no layout API.
      - regex: "^chartImageFillKey$"
      - regex: "^chartImageFillPixelTransform$"
      # Per-rendered-size chart picture preparation: a scratch-surface chart
      # paint records the sizes; keys/lookups address the decoded sources.
      - regex: "^chartImageFillNeedsRenderedSize$"
      - regex: "^chartFillRenderedSizeKey$"
      - regex: "^chartImageFillStoreLookup$"
      - regex: "^collectChartFillRenderedSizes$"
      - regex: "^assertChartFillRenderedSizeCount$"
      - regex: "^chartImageFillUsageSize$"
      - regex: "^collectChartImageFillUsages$"
      - regex: "^collectChartImageFillUsagesForCharts$"
      - regex: "^collectChartMarkerImageFills$"
      - regex: "^collectChartMarkerImageFillsForCharts$"
      # DrawingML silhouette clipping is shared paint behavior used by
      # resource-backed shape fills; it does not expose layout acquisition.
      - regex: "^clipDrawingMLShape$"
      - regex: "^crispOffset$"
      - regex: "^defaultDpr$"
      - regex: "^deferBitmapCloseWhileLeased$"
      - regex: "^docxBorderDashArray$"
      - regex: "^drawImageCropped$"
      # Pure geometry: the full source frame a stretched/cropped CT_Blip chain
      # is evaluated on. It reads authored fractions only, never layout.
      - regex: "^stretchedSourceFrame$"
      - regex: "^doubleRailGeometry$"
      - regex: "^fillDoubleBorder$"
      # Shared decoded-surface ownership is a paint resource concern. DOCX may
      # create/drop derived clrChange/duotone surfaces without importing layout.
      - regex: "^dropCachedDerivedBitmapNamespace$"
      - regex: "^decodedBitmapTargetResizeOptions$"
      - regex: "^duotoneImageData$"
      - regex: "^applyImageDataTransform$"
      - regex: "^decodeSvgBlobOnMainThread$"
      - regex: "^OoxmlDecodedImageLimitError$"
      - regex: "^getCachedBitmapByPath$"
      # Shared CT_Blip decoding/effects own bounded image resources only; the
      # interpreter never acquires text, layout, or parser-model geometry.
      - regex: "^getCachedDuotoneBitmapByPath$"
      - regex: "^getCachedDerivedBitmap$"
      - regex: "^getCachedSvgImageByPath$"
      # Header inspection reuses the document-owned byte profile to decide
      # whether browser target-resize is available. Both predicates remain
      # paint-resource admission and cannot affect acquired layout geometry.
      - regex: "^inspectCachedRasterSource$"
      - regex: "^isBrowserResizableRasterMimeType$"
      - regex: "^isDecodeTargetResizableRasterFormat$"
      - regex: "^isOoxmlDecodedImageLimitError$"
      # Lazy archive admission errors remain terminal at paint-resource catches.
      - regex: "^OoxmlResourceLimitError$"
      # An invalid authored CT_Blip chain cannot be replaced by a raw fallback.
      - regex: "^OoxmlError$"
      - regex: "^isTiffDecodeError$"
      # Missing optional image codecs are contained at paint-resource acquisition;
      # the placeholder consumes only the already-retained authored bounds.
      - regex: "^isOptionalImageCodecUnavailableError$"
      - regex: "^paintOptionalImagePlaceholder$"
      - regex: "^imageNaturalSize$"
      - regex: "^isHTMLCanvas$"
      - regex: "^mathToMathML$"
      # Math engine output is decoded before layout; paint consumes only the
      # resulting CanvasImageSource keyed by the immutable resource record.
      - regex: "^rasterizeMathSvg$"
      - regex: "^metafileRasterSize$"
      # Paint-time image admission uses the completed layout box and effective
      # DPR to choose a retained decode. These resource-policy primitives neither
      # measure nor feed geometry back into DocumentLayout.
      - regex: "^MAX_RASTER_PIXELS$"
      # Per-axis ceiling admitting a composed §20.1.8.58 tile cell before its
      # scratch surface is allocated; a resource-policy constant only.
      - regex: "^MAX_RASTER_DIMENSION$"
      # The authored frame of a grown effect surface and the neighbour periods
      # its outset reaches: the §20.1.8.58 tile period and cell composition.
      # Decoded-image geometry and a work ceiling only.
      - regex: "^imageEffectFrame$"
      - regex: "^imageEffectOutsetPeriods$"
      - regex: "^MAX_IMAGE_EFFECT_PIXEL_WORK$"
      # Decoded-image policy is shared across all format painters. DOCX supplies
      # immutable paint demands and consumes the returned target plan; neither
      # operation may feed measurement or pagination.
      - regex: "^normalizeImageResourceOptions$"
      - regex: "^planDecodedImageTargets$"
      - regex: "^paintDrawingMLShape$"
      # Bounded VML mask/concentric compositing allocates temporary paint-only surfaces.
      - regex: "^createAuxCanvas$"
      - regex: "^withVertFeature$"
      # Draws retained text at the reference em layout planned for it (core
      # reference-advances.ts): save/translate/scale/fillText only, never
      # measureText, so paint stays measurement-free.
      - regex: "^fillTextAtReference$"
      - regex: "^preferVectorBlip$"
      - regex: "^releaseOwnedBitmap$"
      - regex: "^resolvedCachedBitmapVariantKey$"
      - regex: "^sourceRasterTargetSize$"
      - regex: "^PT_TO_PX$"
      # Shared fill resolution keeps gradient/no-fill semantics identical across
      # DOCX, PPTX, and XLSX painters; paint may consume it but not layout APIs.
      - regex: "^resolveFill$"
      - regex: "^recolorSvg$"
      - regex: "^renderChart$"
      - regex: "^withDrawingMLShapeTransform$"
      # This scope only adjusts a CanvasPattern's phase while painting a
      # retained DrawingML shape; it cannot acquire or alter page layout.
      - regex: "^withPatternCoordinateSpace$"
      # Serial admission and bitmap pinning are document-owned paint-resource
      # lifecycle concerns, not layout acquisition.
      - regex: "^withBitmapCacheLease$"
  core-type:
    any:
      - regex: "^OptionalImageCodecUnavailableError$"
      - regex: "^HyperlinkTarget$"
      # Optional renderers and image codecs are paint-only capabilities threaded
      # into existing shared painters. Their erased contracts do not expose
      # layout acquisition or permit a renderer back-edge.
      - regex: "^ChartThreeDRenderer$"
      - regex: "^ChartRegionMapRenderer$"
      - regex: "^ChartExRenderer$"
      - regex: "^ChartImageLookup$"
      - regex: "^Duotone$"
      - regex: "^BlipEffect$"
      - regex: "^ImageResourceOptions$"
      - regex: "^MathRenderer$"
      - regex: "^TiffRenderer$"
      # Erased SVG decoder capability; paint forwards it to the shared image owner.
      - regex: "^SvgBlobDecoder$"
      # Read-only lookup of layout's reference-advance decisions; it exposes
      # no probing or measurement entry point.
      - regex: "^TextAdvanceLookup$"
  chart-font-sources-value:
    any:
      - regex: "^withChartFontSubstitutions$"
  # Canvas `lang` selection/restoration around a draw (#2001): pure Canvas
  # text state, the same value layout measured with; no measurement entry.
  canvas-language-value:
    any:
      - regex: "^selectCanvasLanguage$"
      - regex: "^restoreCanvasLanguage$"
      # save() that keeps that language on the active state (Chrome resets it).
      - regex: "^saveCanvasState$"
  from-core:
    has: { field: source, regex: "^['\"]@silurus/ooxml-core['\"]$" }
  from-chart-font-sources:
    has: { field: source, regex: "^['\"]@silurus/ooxml-core/internal/chart-font-sources['\"]$" }
  from-canvas-language:
    has: { field: source, regex: "^['\"]@silurus/ooxml-core/internal/canvas-language['\"]$" }
  type-only-statement:
    regex: "^import\\s+type\\s*\\{"
  typed-specifier:
    kind: import_specifier
    regex: "^type\\s"
rule:
  any:
    # Re-exporting a package, or importing one outside the list.
    - kind: export_statement
      has: { field: source, regex: "^['\"][^.]" }
    - kind: import_statement
      has: { field: source, regex: "^['\"][^.]" }
      not:
        any:
          - matches: from-core
          - matches: from-chart-font-sources
          - matches: from-canvas-language
    # A comment inside the statement can hide `type` from the rules below.
    - kind: import_statement
      all:
        - has: { field: source, regex: "^['\"][^.]" }
        - has: { stopBy: end, kind: comment }
    # Default, namespace, side-effect and empty imports name no reviewed binding.
    - kind: import_statement
      has: { field: source, regex: "^['\"][^.]" }
      any:
        - not: { has: { stopBy: end, kind: import_specifier } }
        - has: { stopBy: end, kind: namespace_import }
        - has: { kind: import_clause, has: { kind: identifier } }
        # Type and value bindings in one statement.
        - all:
            - not: { matches: type-only-statement }
            - has: { stopBy: end, matches: typed-specifier }
            - has: { stopBy: end, kind: import_specifier, not: { matches: typed-specifier } }
    # A binding outside its list. An aliased specifier (`a as b`) matches no entry.
    - kind: import_specifier
      inside:
        stopBy: end
        kind: import_statement
        matches: from-core
      not:
        any:
          - all:
              - matches: core-type
              - inside: { stopBy: end, kind: import_statement, matches: type-only-statement }
          - all:
              - matches: core-value
              - not: { inside: { stopBy: end, kind: import_statement, matches: type-only-statement } }
          - all:
              - matches: typed-specifier
              - has: { field: name, matches: core-type }
              - not: { has: { field: alias, kind: identifier } }
    - kind: import_specifier
      inside:
        stopBy: end
        kind: import_statement
        matches: from-chart-font-sources
      not:
        all:
          - matches: chart-font-sources-value
          - not: { inside: { stopBy: end, kind: import_statement, matches: type-only-statement } }
    - kind: import_specifier
      inside:
        stopBy: end
        kind: import_statement
        matches: from-canvas-language
      not:
        all:
          - matches: canvas-language-value
          - not: { inside: { stopBy: end, kind: import_statement, matches: type-only-statement } }
files:
  - "packages/docx/src/paint/**/*.ts"
ignores:
  - "packages/docx/src/paint/**/*.d.ts"
  - "packages/docx/src/paint/**/*.{test,spec,stories,test-support,bench}.{ts,tsx}"
  - "packages/docx/src/paint/**/wasm/**"
